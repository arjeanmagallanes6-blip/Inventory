<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WIMS Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body>

<div class="wrap">
    <div class="card">
        <div class="logo">
            <svg fill="none" stroke="white" stroke-width="2" viewBox="0 0 24 24">
                <path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
            </svg>
        </div>

        <h1>Inventory System</h1>
        <p class="subhead">Sign in to manage your stock</p>

        <div id="alertBox" class="alert d-none py-2" role="alert"></div>

        <form id="loginForm">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" name="username" id="username" class="form-control" required autofocus>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" class="form-control" required>
            </div>

            <button type="submit" id="submitBtn" class="btn">Sign In</button>

            <div class="footnote">
                Don't have an account? <a href="register.html" class="link">Register here</a>
            </div>
        </form>
    </div>
</div>

<script src="../js/login.js"></script>
</body>
</html>
